<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Recompensas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      text-align: center;
      margin-bottom: 20px;
      box-sizing: border-box;
    }
    .points {
      font-size: 36px;
      font-weight: bold;
      color: #4caf50;
      margin: 10px 0;
    }
    .usd {
      font-size: 18px;
      color: #aaaaaa;
      margin-bottom: 20px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 10px;
      font-weight: bold;
    }
    button:disabled {
      background-color: #555555;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0d0d0d;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
      text-align: center;
    }
    .modal h3 {
      font-size: 22px;
      margin-bottom: 15px;
      color: #ffffff;
    }
    .timer {
      font-size: 32px;
      font-weight: bold;
      color: #ffeb3b;
      background: #1e1e1e;
      padding: 15px 30px;
      border-radius: 12px;
      border: 2px solid #333;
    }
    #debug-log {
      background-color: #000;
      color: #00ff00;
      font-family: monospace;
      font-size: 12px;
      padding: 10px;
      border-radius: 6px;
      width: 100%;
      max-width: 400px;
      height: 100px;
      overflow-y: auto;
      text-align: left;
      border: 1px solid #333;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Tus Recompensas</h2>
    <div class="points" id="user-points">0</div>
    <div class="usd" id="user-usd">≈ $0.00 USDT</div>
    <button id="btn-watch-ad" onclick="startAdVideo()">Ver Video (+10 pts)</button>
  </div>

  <div class="card">
    <h3>Retirar Ganancias</h3>
    <input type="text" id="binance-id" placeholder="ID o correo Binance Pay" style="width:100%; padding:10px; margin-bottom:12px; border-radius:6px; border:1px solid #444; background:#222; color:#fff; box-sizing:border-box;">
    <button onclick="requestWithdrawal()">Solicitar Retiro ($5.00)</button>
  </div>

  <div style="width: 100%; max-width: 400px;">
    <p style="font-size:12px; color:#888; margin-bottom:4px;">Registro de Estado:</p>
    <div id="debug-log">Aplicación cargada correctamente.</div>
  </div>

  <div class="modal" id="ad-modal">
    <h3>🎬 Reproduciendo Anuncio...</h3>
    <div class="timer" id="video-timer">⏱️ 15s</div>
  </div>

  <script src="cordova.js"></script>
  <script src="app.js"></script>
</body>
</html>
